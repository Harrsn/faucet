name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Lock files match the .in files
        run: |
          pip install uv
          uv pip compile requirements.in --universal --python-version 3.10 --generate-hashes -o /tmp/req.txt -q
          uv pip compile requirements-dev.in -c requirements.txt --universal --python-version 3.10 --generate-hashes -o /tmp/req-dev.txt -q
          diff <(grep -E '^[a-z]' requirements.txt) <(grep -E '^[a-z]' /tmp/req.txt) || { echo "requirements.txt is stale: regenerate it from requirements.in"; exit 1; }
          diff <(grep -E '^[a-z]' requirements-dev.txt) <(grep -E '^[a-z]' /tmp/req-dev.txt) || { echo "requirements-dev.txt is stale: regenerate it"; exit 1; }
      - name: Lint
        run: ruff check faucet/ tests/
      - name: UI modules parse
        run: |
          set -e
          for f in $(find faucet/static/app -name '*.js'); do node --check "$f"; done
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase owner for GHCR
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/faucet:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/faucet:${{ github.sha }}
