# deploy/stack.yml — the faucet service.
#
# Deployed by deploy/deploy.sh:
#   docker compose -p cascade -f deploy/stack.yml up -d --force-recreate
#
# There are deliberately no secrets in this file.
#
# Settings (Jackett, download client, paths, notifications) live in Faucet's
# database and are edited in Settings; since 1.7 a value for one of them here
# is ignored (and logged). This file only carries bootstrap and tunables that
# have no UI yet, plus SESSION_SECRET via env_file.

services:
  faucet:
    image: faucet:local
    container_name: faucet
    restart: unless-stopped

    ports:
      # host 8090 -> container 8088. 8088 on the host is the old mediapipe app.
      - "8090:8088"

    # SESSION_SECRET only. Root-owned 600 on the host; never in git.
    env_file:
      - /opt/cascade-config/faucet.secrets.env

    environment:
      # Bootstrap and infrastructure only. Hunting, retention and other
      # behaviour live in Settings now (HUNT_MAX_ACTIVE and HUNT_MAX_PER_RUN
      # were 5 and 3 here — the defaults — so nothing changes by dropping them).
      EVENTS_FILE: "/config/events.jsonl"
      MEDIASORT_MODE: "move"
      # Public traffic arrives Cloudflare Tunnel -> Caddy -> 127.0.0.1:8090 ->
      # docker-proxy, i.e. from this network's gateway. Trust that hop's
      # CF-Connecting-IP / CF-Visitor so login throttling sees the real
      # client and session cookies get Secure. LAN clients hitting :8090
      # directly keep their own source address and can't spoof it.
      TRUSTED_PROXIES: "auto"

    volumes:
      - /mnt/nas:/nas
      - /mnt/nas/media:/library
      - /mnt/nas/torrents:/downloads
      - /opt/cascade-config:/config
