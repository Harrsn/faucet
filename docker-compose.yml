# Faucet — self-hosted media manager, with Jackett and Transmission bundled.
#
#   1. cp .env.example .env   (set SESSION_SECRET; everything else is optional)
#   2. docker compose up -d
#   3. open http://localhost:8088 — the setup wizard takes it from there
#
# Storage: ONE data folder, mounted at /data in both Faucet and Transmission:
#
#   ./data/media/tvshows   ./data/media/movies     <- your libraries
#   ./data/torrents/                               <- downloads
#
# Downloads and libraries on one mount means a finished download moves into
# the library with an instant rename. Separate mounts (/downloads + /library),
# even of the same disk, force a full copy of every file.
#
# Already running Jackett or a download client? Delete that service and enter
# yours in the setup wizard.

services:
  faucet:
    image: ghcr.io/harrsn/faucet:latest
    # build: .                # to build locally instead of pulling
    container_name: faucet
    restart: unless-stopped
    ports:
      - "8088:8088"
    env_file: .env
    environment:
      EVENTS_FILE: /config/events.jsonl
      # First-start defaults for the bundled services and the /data layout.
      # Imported once; after that Settings (or the wizard) owns them.
      JACKETT_URL: http://jackett:9117
      DOWNLOAD_CLIENT: transmission
      CLIENT_URL: http://transmission:9091/transmission/rpc
      LIBRARY_ROOT: /data/media
      DOWNLOAD_DIR: /data/torrents
      COMPLETE_DIR: /data/torrents
      DISK_PATH: /data
      BROWSE_ROOT: /data
    volumes:
      - ./config:/config
      - ${DATA_PATH:-./data}:/data
    depends_on:
      - jackett
      - transmission

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: faucet-jackett
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ./config/jackett:/config
    ports:
      - "9117:9117"           # add your indexers in Jackett's UI

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: faucet-transmission
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      USER: ${CLIENT_USER:-faucet}
      PASS: ${CLIENT_PASS:-faucet}
    volumes:
      - ./config/transmission:/config
      - ${DATA_PATH:-./data}:/data
    ports:
      - "9091:9091"
