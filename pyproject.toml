[project]
name = "faucet-media"
version = "2.0.1"
description = "Self-hosted search, download, sort, and manage for your media library."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harrison Korodi" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "requests>=2.31",
  "guessit>=3.8",
  "pydantic>=2.0",
  "bcrypt>=4.0",
  "itsdangerous>=2.0",
]

[project.urls]
Homepage = "https://github.com/Harrsn/faucet"
Issues = "https://github.com/Harrsn/faucet/issues"

[project.scripts]
faucet-sort = "faucet.sort:main"
faucet-tidy = "faucet.libtidy:main"

[tool.setuptools.packages.find]
include = ["faucet*"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
# Correctness, not style: syntax/import errors, undefined names, unused
# imports/variables, and the bugbear set. CI fails on any of these.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
  "B008",   # FastAPI's Depends()/Query() in argument defaults is the idiom
  "B904",   # HTTPException raised in except blocks is intentional
]

[tool.ruff.lint.per-file-ignores]
# app.py wires logging, the DB and the auth gate before importing routers
"faucet/app.py" = ["E402"]
"tests/*" = ["E401", "E702", "E741", "F841", "B"]
